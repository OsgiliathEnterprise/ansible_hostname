---
#
# Ansible managed
#

name: Ansible Molecule

on:
  push:
  pull_request:
    branches:
      - master
      - tags/*

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: tcharl.ansible_hostname
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: install prereq
        run: |
          cd tcharl.ansible_hostname
          uv tool run --python 3.13 --from ansible-core ansible-galaxy role install -r requirements.yml
          uv tool run --python 3.13 --from ansible-core ansible-galaxy collection install -r requirements-collections.yml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: tcharl.ansible_hostname
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: tox lint
        run: |
          cd tcharl.ansible_hostname
          uv tool run --python 3.13 --with tox tox -e lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: tcharl.ansible_hostname
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: update apt
        run: |
          sudo apt update
      - name: install aptitude packages
        run: |
          sudo apt -y install sudo python3 python3-pip podman
      - name: pip install packages
        run: |
          sudo pip install uv
      - name: Show Podman info
        run: |
          sudo podman info
      - name: Test with podman
        env:
          ANSIBLE_REMOTE_TMP: /var/tmp/ansible-remote
        run: |
          cd tcharl.ansible_hostname
          sudo uv tool run --python 3.13 --with tox tox -e test-exec
