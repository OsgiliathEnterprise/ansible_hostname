---

- name: Assert | test if hostname is set correctly
  ansible.builtin.assert:
    that:
      - hostname is defined
      - hostname is string
    quiet: yes

- name: Assert | test if hostname_reboot is set correctly
  ansible.builtin.assert:
    that:
      - hostname_reboot is defined
      - hostname_reboot is boolean
    quiet: yes

- name: Assert | Network facts
  ansible.builtin.setup:
    gather_subset:
      - network
  become: true
  register: hostname_current_host_facts

- name: Assert | debug network facts
  ansible.builtin.debug:
    var: hostname_current_host_facts
    verbosity: 2

- name: Assert | debug ansible network facts
  ansible.builtin.debug:
    msg: "{{ hostname_current_host_facts.ansible_facts }}"
    verbosity: 2

- name: Assert | debug preferred NIC facts
  ansible.builtin.debug:
    msg: "{{ hostname_current_host_facts.ansible_facts['ansible_' ~ (preferred_nic | replace('-', '_'))] }}"
    verbosity: 2
  when:
    - preferred_nic is defined
    - preferred_nic != ""

- name: Assert | test if the fact is set correctly
  ansible.builtin.assert:
    that:
      - hostname_current_host_facts.ansible_facts['ansible_' ~ (preferred_nic | replace('-', '_'))] is defined
    fail_msg: "The fact with Preferred NIC {{ preferred_nic }} is failing. Please check your network configuration."
    quiet: yes
  when:
    - preferred_nic is defined
    - preferred_nic != ""

- name: Assert | test if hostname_reboot is set correctly
  ansible.builtin.assert:
    that:
      - hostname_current_host_facts.ansible_facts['ansible_' ~ (preferred_nic | replace('-', '_'))] | map(attribute='ipv4.address') is defined
    fail_msg: "Preferred NIC {{ preferred_nic }} does not have an IPv4 address. Please check your network configuration."
    quiet: yes
  when:
    - preferred_nic is defined
    - preferred_nic != ""
